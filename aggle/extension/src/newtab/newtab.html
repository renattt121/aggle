<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="centered">
    <div class="brand">
      <img src="../../public/icons/aggle-icon.svg" alt="" class="logo">
      <span class="brand-name">Aggle</span>
    </div>

    <p class="greeting" id="greeting">Good evening</p>
    <div class="clock">
      <div class="clock-time" id="clock-time">12:00 PM</div>
      <div class="clock-date" id="clock-date">Mon, Jan 1</div>
    </div>

    <form id="search-form" class="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search with DuckDuckGo…" autocomplete="off" autofocus>
    </form>

    <div class="links" id="quick-links"></div>
  </div>

  <script src="../../dist/newtab.js"></script>
</body>
</html>
