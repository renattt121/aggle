<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      margin: 0;
      padding: 8px;
      background: #131316;
      color: #EDEDEF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9B9BA4;
      margin-bottom: 8px;
      padding-left: 8px;
    }
    .workspace {
      display: flex;
      align-items: center;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .workspace:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .workspace.active {
      background: rgba(255, 90, 31, 0.15);
      color: #FF5A1F;
    }
    .icon {
      margin-right: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">Workspaces</div>
  <div class="workspace">
    <span class="icon">🏠</span>
    <span>Personal</span>
  </div>
  <div class="workspace active">
    <span class="icon">💼</span>
    <span>Work</span>
  </div>
  <div class="workspace">
    <span class="icon">🧪</span>
    <span>Research</span>
  </div>
  <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.1); margin: 8px 0;">
  <div class="workspace" data-workspace-id="new-workspace" style="color: #9B9BA4;">
    <span class="icon">➕</span>
    <span>New Workspace</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
